<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "StudioPlaceholder";
        src: url("assets/segoeuib.ttf") format("truetype");
        font-weight: 700;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #111318; }
      #root { width: 100%; height: 100%; position: relative; font-family: "StudioPlaceholder", sans-serif; }
      #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
      .line { overflow: hidden; }
      .word { display: block; color: #f5f5f4; font-size: 150px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }
      #bar { width: 0; height: 12px; background: #ff5a36; border-radius: 6px; }
      #sub { color: #a8a29e; font-size: 44px; font-weight: 700; letter-spacing: 0.3em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div class="line" data-layout-allow-overflow><span class="word" id="w1">STUDIO</span></div>
        <div class="line" data-layout-allow-overflow><span class="word" id="w2">ONLINE</span></div>
        <div id="bar"></div>
        <div id="sub">SMOKE TEST</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#w1", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out" }, 0.2)
        .fromTo("#w2", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "power4.out" }, 0.35)
        .fromTo("#bar", { width: 0 }, { width: 520, duration: 0.6, ease: "power3.inOut" }, 0.9)
        .fromTo("#sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.2)
        .to("#stage", { scale: 1.06, duration: 3.0, ease: "none" }, 1.5)
        .to(["#w1", "#w2", "#bar", "#sub"], { opacity: 0, duration: 0.4, stagger: 0.05 }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
